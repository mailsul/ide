version: '3.9'

services:
  # ─── REVERSE PROXY ───────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: platform-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=platform-net"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
      - ./docker/traefik/dynamic:/etc/traefik/dynamic
    networks:
      - platform-net
    restart: unless-stopped

  # ─── DATABASE PLATFORM ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASS}
      POSTGRES_DB: platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - platform-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── WORKSPACE DATABASES ────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: platform-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: platform_meta
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - platform-net
    restart: unless-stopped

  postgres-ws:
    image: postgres:16-alpine
    container_name: platform-postgres-ws
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_ws_data:/var/lib/postgresql/data
    networks:
      - platform-net
    restart: unless-stopped

  # ─── DATABASE ADMIN UI ───────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: platform-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 300M
    networks:
      - platform-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pma.rule=Host(`phpmyadmin.${DOMAIN}`)"
      - "traefik.http.routers.pma.entrypoints=websecure"
      - "traefik.http.routers.pma.tls.certresolver=letsencrypt"
      - "traefik.http.services.pma.loadbalancer.server.port=80"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: platform-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - platform-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.${DOMAIN}`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls.certresolver=letsencrypt"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

  # ─── BACKEND API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    container_name: platform-backend
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://platform:${PLATFORM_DB_PASS}@postgres:5432/platform
      SESSION_SECRET: ${SESSION_SECRET}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_HOST: mysql
      POSTGRES_ROOT_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      POSTGRES_WS_HOST: postgres-ws
      PLATFORM_DOMAIN: ${DOMAIN}
      WORKSPACE_BASE_PATH: /workspaces
      TRAEFIK_DYNAMIC_DIR: /traefik/dynamic
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /workspaces:/workspaces
      - ./docker/traefik/dynamic:/traefik/dynamic
    networks:
      - platform-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  # ─── FRONTEND ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: artifacts/ide-platform/Dockerfile
      args:
        VITE_API_URL: https://api.${DOMAIN}
    container_name: platform-frontend
    networks:
      - platform-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

volumes:
  postgres_data:
  postgres_ws_data:
  mysql_data:
  pgadmin_data:
  traefik_letsencrypt:

networks:
  platform-net:
    name: platform-net
    driver: bridge
